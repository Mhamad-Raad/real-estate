# Security headers, in a file because they must be **repeated in every location block**.
#
# Nginx's `add_header` does not merge: a block that adds any header of its own discards every one
# inherited from its parent. Both `/` and `/assets/` set `Cache-Control`, which silently dropped
# the CSP and the frame/sniff protections from exactly the responses that serve the app — the
# server-level copy was there, and reached nothing that mattered. Found with `curl -D-`.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# `data:` in font-src is required: the Sorani and Arabic faces are **bundled as data URIs** so the
# app needs no CDN (§12 offline). Without it the CSP blocks the office's own script from loading —
# caught in the browser, where the console filled with 'Loading the font ... was blocked'.
# `blob:` in object-src/frame-src is required, not decoration: every PDF preview is fetched with
# an auth header and handed to an <iframe>/<object> as a blob URL (§4.4). Without it the document
# panes render empty.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; object-src 'self' blob:; frame-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'" always;
