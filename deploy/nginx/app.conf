# Nginx — serves the built SPA and reverse-proxies the API (§2.3).
#
# One origin for both halves. The alternative (frontend on one port, API on another) means CORS,
# and CORS on a LAN with no DNS is a source of failures that look like bugs in the app.

upstream backend {
    # The Compose service name. Docker's embedded DNS resolves it, so nothing here hard-codes an
    # IP that would change when the office's machines are re-addressed (§2.4).
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # 210m, not 64m: the backlog door (§5.9) takes a scan of a **whole case file** as one upload,
    # and `documents.services.size_limit_for` allows a compiled case up to MAX_GENERATED_BYTES
    # (200 MB). At 64m a twenty-page colour scan is refused **here**, by the proxy, with a bare 413
    # and nothing in the app's log to explain it. Nginx stays deliberately permissive and Django
    # decides — an ordinary paper is still held to MAX_UPLOAD_BYTES (25 MB) by the app itself.
    client_max_body_size 210m;

    # LibreOffice takes its time on a compiled export; the default 60s read timeout would cut the
    # connection while the request was still working, showing the lawyer a failure for a job that
    # actually succeeded.
    proxy_connect_timeout 15s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # No version banner. It tells an attacker which CVEs to try and tells a lawyer nothing.
    server_tokens off;

    # This app has no third-party scripts, fonts or images by design (§12 offline), so the policy
    # can be strict enough to be worth having. Included per-location, not set here: see the file.
    include /etc/nginx/conf.d/security-headers.conf;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The login throttle counts per IP (§12). Without this the proxy's own address is the only
        # one Django ever sees, so both office computers would share one allowance.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A download is streamed straight through rather than buffered to disk first.
        proxy_buffering off;
    }

    # DRF's own assets (its browsable API). Collected into the backend image at build time.
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /health/ {
        proxy_pass http://backend/api/v1/health/;
        # Without this nginx sends the **upstream name** as the Host, so Django sees `backend`,
        # which is not in ALLOWED_HOSTS, and answers 400 — a health endpoint that reports the app
        # as broken because of the proxy in front of it.
        proxy_set_header Host $host;
        access_log off;  # polled by the Compose healthcheck; it would drown the real traffic
    }

    # Hashed filenames from Vite, so these can be cached hard and for ever.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The SPA. Every unknown path falls back to index.html so a deep link (a bookmarked case)
    # loads the app instead of a 404 — client-side routing owns the path from there.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.conf;
        # index.html itself must never be cached, or a browser keeps serving the old bundle after
        # an update and the version-mismatch banner fires on every machine that visited before.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
